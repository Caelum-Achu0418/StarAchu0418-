name: Import AI Virtual Phone

on:
  push:
    branches: [virtual-phone]
    paths:
      - '.github/workflows/import-virtual-phone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: virtual-phone
          fetch-depth: 0

      - name: Fetch upstream AI Virtual Phone
        run: |
          rm -rf /tmp/ai-virtual-phone
          git clone --depth 1 --branch main https://github.com/xiaolongbao0709/ai-virtual-phone.git /tmp/ai-virtual-phone

      - name: Replace branch contents with upstream
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name import-virtual-phone.yml -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/ai-virtual-phone/ ./
          if [ -d /tmp/ai-virtual-phone/.github ]; then
            rsync -a /tmp/ai-virtual-phone/.github/ .github/
          fi
          cat > .env.production <<'EOF'
          NEXT_PUBLIC_SELF_HOSTED_MODE=true
          EOF

      - name: Commit imported app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import xiaolongbao0709/ai-virtual-phone for self-hosted deployment' || exit 0
          git push origin virtual-phone
