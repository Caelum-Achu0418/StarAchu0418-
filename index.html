<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7fb2dd">
  <title>StarAchu</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:linear-gradient(135deg,#edf5fb,#fbf8f2);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#5e6c79}
    .boot{width:min(82vw,340px);padding:28px 24px;text-align:center;border:1px solid rgba(255,255,255,.85);border-radius:26px;background:rgba(255,255,255,.65);box-shadow:0 20px 60px rgba(90,120,150,.13);backdrop-filter:blur(24px)}
    .star{font-size:30px;color:#7fb2dd;margin-bottom:10px}.title{font-size:17px;font-weight:650;color:#41505e}.sub{font-size:13px;line-height:1.7;margin-top:8px;opacity:.75}
    button{margin-top:16px;border:0;border-radius:14px;padding:10px 18px;background:#7fb2dd;color:white;font-size:14px}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div class="star">✦</div><div class="title">正在打开 Plume</div><div class="sub">加载原版界面，并启用主动消息扩展…</div></div>
<script>
(async()=>{
  const snapshot='a75300114cf82bc1de5912d3402ae00126f25e5a';
  const sources=[
    `https://cdn.jsdelivr.net/gh/rainmow52000/plume@${snapshot}/index.html`,
    `https://raw.githubusercontent.com/rainmow52000/plume/${snapshot}/index.html`
  ];
  let html='',lastErr='';
  for(const url of sources){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      html=await r.text();
      if(html.includes('<script')&&html.includes('chatAppDB'))break;
      html='';
    }catch(e){lastErr=e&&e.message?e.message:String(e)}
  }
  if(!html){
    const b=document.getElementById('boot');
    b.innerHTML='<div class="star">✦</div><div class="title">这次没加载出来</div><div class="sub">原版 Plume 源文件暂时无法读取。网络恢复后点一下重试。<br>'+lastErr.replace(/[<>&]/g,'')+'</div><button onclick="location.reload()">重新加载</button>';
    return;
  }
  const tag='<script src="proactive.js?v=20260815-2"><\\/script>';
  html=html.replace(/<\\/body>\\s*<\\/html>\\s*$/i,tag+'</body></html>');
  if(!html.includes('proactive.js'))html+=tag;
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
